<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baruc Shopping — Seu shopping online</title>

    <meta
      name="description"
      content="Baruc Shopping — praticidade, confiança e ofertas. Sua experiência premium começa aqui."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Baruc Shopping" />
    <meta property="og:title" content="Baruc Shopping — Seu shopping online" />
    <meta
      property="og:description"
      content="Praticidade, confiança e ofertas para você. E-commerce premium Baruc Shopping."
    />
    <link rel="icon" type="image/svg+xml" href="/logo-baruc.svg" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"
      />
    </noscript>
    <script>
      // Brand default: dark. Only skip dark class for an explicit light preference.
      (function () {
        try {
          var stored = localStorage.getItem('baruc:theme');
          if (stored !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
