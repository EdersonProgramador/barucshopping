# Baruc Shopping — Render Blueprint (API)
# Database: Neon Postgres (set DATABASE_URL in the Render dashboard)
# Dashboard: New → Blueprint → connect EdersonProgramador/barucshopping

services:
  - type: web
    name: baruc-shopping-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    initialDeployHook: npx tsx prisma/seed.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://barucshopping-lqeb.vercel.app
      # Paste the Neon connection string (Dashboard → Connection string → URI + ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
